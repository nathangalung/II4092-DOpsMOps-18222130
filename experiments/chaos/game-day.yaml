# SK-N-04 — game-day resilience drills (validates KNF-04 end-to-end).
# Two serial Workflows run manually during evaluation:
#   eval-game-day          use-case serving tier: gateway packet loss ->
#                          feature-cache kill -> ml-bridge MLflow latency.
#   eval-platform-game-day platform substrate tier: CNPG primary kill ->
#                          Kafka broker link loss.
# The per-fault one-shots in pod-chaos.yaml / network-chaos.yaml run each
# leg in isolation.
#
# Render the domain vars from the loaded config before applying:
#   set -a; . "${EXPERIMENTS_CONFIG:-experiments/config.crypto.env}"; set +a
#   envsubst < experiments/chaos/game-day.yaml | kubectl apply -f -
# Remove when done:
#   envsubst < experiments/chaos/game-day.yaml | kubectl delete -f -
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: eval-game-day
  namespace: platform-test
spec:
  entry: resilience
  templates:
    - name: resilience
      templateType: Serial
      children: [gateway-loss, cache-kill, mlflow-latency]
    - name: gateway-loss
      templateType: NetworkChaos
      deadline: '6m'
      networkChaos:
        action: loss
        mode: one
        selector:
          namespaces: [${USE_CASE_NAMESPACE}]
          labelSelectors: { app: ${GATEWAY_APP} }
        loss: { loss: '15', correlation: '25' }
        # Inside Workflow templates duration is forbidden (vworkflow.kb.io);
        # the parent deadline (6m) bounds it. Empty targets -> direction `to`.
        direction: to
    - name: cache-kill
      templateType: PodChaos
      deadline: '3m'
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces: [${USE_CASE_NAMESPACE}]
          labelSelectors: { app: ${FEATURE_CACHE_APP} }
    - name: mlflow-latency
      templateType: NetworkChaos
      deadline: '5m'
      networkChaos:
        action: delay
        mode: all
        selector:
          namespaces: [model-lifecycle]
          labelSelectors: { app.kubernetes.io/name: mlflow }
        delay: { latency: '300ms', jitter: '50ms', correlation: '50' }
        # duration omitted in Workflow templates — parent deadline (5m) bounds.
        direction: both
        target:
          mode: all
          selector:
            namespaces: [${USE_CASE_NAMESPACE}]
            labelSelectors: { app: ${ML_BRIDGE_APP} }
---
# Platform substrate drill: the shared infrastructure the whole platform sits
# on. Kill the CNPG Postgres primary, then degrade a Kafka broker link. Both
# legs platform-generic (no envsubst vars). Complements eval-game-day's
# use-case serving tier with the infrastructure tier.
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: eval-platform-game-day
  namespace: platform-test
spec:
  entry: substrate
  templates:
    - name: substrate
      templateType: Serial
      children: [cnpg-kill, kafka-loss]
    - name: cnpg-kill
      templateType: PodChaos
      deadline: '5m'
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces: [storage]
          labelSelectors: { cnpg.io/cluster: postgresql }
    - name: kafka-loss
      templateType: NetworkChaos
      deadline: '5m'
      networkChaos:
        action: loss
        mode: one
        selector:
          namespaces: [data-ingestion]
          labelSelectors: { strimzi.io/cluster: platform-kafka, strimzi.io/broker-role: "true" }
        loss: { loss: '10', correlation: '25' }
        # duration omitted in Workflow templates — parent deadline (5m) bounds.
        direction: to
