# SK-N-04 — fault tolerance & automatic recovery (validates KNF-04).
# Kills one Kafka broker and one KServe predictor pod; measure recovery
# (RTO < 5 min, RPO < 1 min) via Prometheus availability queries.
#
# The predictor PodChaos targets the use-case namespace + InferenceService, so
# render ${USE_CASE_NAMESPACE} / ${PREDICTOR_NAME} from the loaded config before
# applying (the Kafka PodChaos is platform-generic and needs no substitution):
#   set -a; . "${EXPERIMENTS_CONFIG:-experiments/config.crypto.env}"; set +a
#   envsubst < experiments/chaos/pod-chaos.yaml | kubectl apply -f -
# Remove when done:
#   envsubst < experiments/chaos/pod-chaos.yaml | kubectl delete -f -
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eval-kafka-broker-kill
  namespace: platform-test
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - data-ingestion
    labelSelectors:
      strimzi.io/cluster: platform-kafka
      strimzi.io/broker-role: "true"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eval-kserve-predictor-kill
  namespace: platform-test
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - ${USE_CASE_NAMESPACE}
    labelSelectors:
      serving.kserve.io/inferenceservice: ${PREDICTOR_NAME}
