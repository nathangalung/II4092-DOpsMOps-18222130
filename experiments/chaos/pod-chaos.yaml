# SK-N-04 — fault tolerance & automatic recovery (validates KNF-04).
# Kills one Kafka broker, the CNPG Postgres primary, one KServe predictor
# pod, and the use-case ml-bridge online-feature reader; measure recovery
# (RTO < 5 min, RPO < 1 min) via Prometheus availability queries.
#
# The predictor + ml-bridge PodChaos target the use-case namespace, so
# render ${USE_CASE_NAMESPACE} / ${PREDICTOR_NAME} / ${ML_BRIDGE_APP} from
# the loaded config before applying (the Kafka + CNPG PodChaos are
# platform-generic, no vars):
#   set -a; . "${EXPERIMENTS_CONFIG:-experiments/config.crypto.env}"; set +a
#   envsubst < experiments/chaos/pod-chaos.yaml | kubectl apply -f -
# Remove when done:
#   envsubst < experiments/chaos/pod-chaos.yaml | kubectl delete -f -
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eval-kafka-broker-kill
  namespace: platform-test
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - data-ingestion
    labelSelectors:
      strimzi.io/cluster: platform-kafka
      strimzi.io/broker-role: "true"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eval-kserve-predictor-kill
  namespace: platform-test
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - ${USE_CASE_NAMESPACE}
    labelSelectors:
      serving.kserve.io/inferenceservice: ${PREDICTOR_NAME}
---
# Use-case serving-side fault: kill the ml-bridge online-feature reader — the
# KServe transformer that fetches Feast/Valkey online features for the
# predictor — and verify it restarts and the serving path resumes within RTO.
# (Replaces the retired feature-cache target: the bespoke Rust gRPC cache was
# removed when crypto moved to Feast-materialize -> Valkey -> ml-bridge, so the
# old `app: feature-cache` selector matched zero pods and the leg was a no-op.)
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eval-ml-bridge-kill
  namespace: platform-test
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - ${USE_CASE_NAMESPACE}
    labelSelectors:
      app: ${ML_BRIDGE_APP}
  gracePeriod: 0
---
# Platform substrate fault: kill the CNPG Postgres primary. Single-instance
# under the single-node mandate, so this measures operator-driven restart and
# recovery within RTO (no standby to fail over to). Platform-generic, no vars.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eval-cnpg-pod-kill
  namespace: platform-test
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - storage
    labelSelectors:
      cnpg.io/cluster: postgresql
  gracePeriod: 0
