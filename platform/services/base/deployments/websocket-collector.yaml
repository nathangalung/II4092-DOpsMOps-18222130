# =============================================================================
# WEBSOCKET COLLECTOR — Real-time Stream Ingestion (Rust)
# =============================================================================
# Connects to WebSocket feeds → Kafka for real-time data.
# Schema validation via Karapace schema registry.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-collector
  labels:
    app: websocket-collector
    component: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket-collector
  template:
    metadata:
      labels:
        app: websocket-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      containers:
        - name: websocket-collector
          image: websocket-collector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: pipeline-secrets
          env:
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # /live is delivery-gated (not plain process-liveness): it reports
          # 503 only when the Kafka producer has gone KAFKA_DELIVERY_STALENESS_MS
          # without a successful delivery *while still attempting sends*. This
          # lets the kubelet restart a producer that wedged after a broker
          # disruption (a fresh producer re-resolves partition leaders cleanly),
          # giving the workload a self-heal path. failureThreshold 3 × 30s adds
          # ~90s confirmation on top of the staleness window so a transient
          # broker restart (which recovers well inside message.timeout.ms) does
          # not trip a needless restart. See src/health.rs::liveness_wedged.
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: websocket-collector
spec:
  selector:
    app: websocket-collector
  ports:
    - port: 8080
      targetPort: 8080
      name: http
