# =============================================================================
# INFERENCE ENGINE — Model Serving (C++ + ONNX Runtime, gRPC)
# =============================================================================
# Loads an ONNX model from MODEL_PATH (default /app/models/model.onnx) and
# serves predictions over gRPC on :50052 (custom Inference + Health RPCs,
# InsecureServerCredentials — TLS is terminated by the Istio sidecar).
#
# Domain-agnostic platform serving OPTION. A use-case may serve via this C++
# engine OR via a KServe InferenceService; a use-case that serves via KServe
# leaves this component disabled (config/services.yaml).
#
# Platform tool integration:
#   - MinIO: model artifact storage (S3-compatible), staged to MODEL_PATH
#   - Feast: feature retrieval for inference requests
#   - KServe: the alternative serving path (InferenceService CRDs) most
#     use-cases choose instead of this engine
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-engine
  labels:
    app: inference-engine
    component: serving
spec:
  # Single-node k3s platform mandate — replicas=1 everywhere.
  replicas: 1
  selector:
    matchLabels:
      app: inference-engine
  template:
    metadata:
      labels:
        app: inference-engine
    spec:
      containers:
        - name: inference-engine
          image: inference-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
              name: grpc
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: pipeline-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          # The binary serves only gRPC on :50052 (no HTTP endpoint) — probe the
          # TCP port. A native grpc: probe would require the standard
          # grpc.health.v1 service, but this binary exposes a *custom* Health RPC
          # (common.HealthRequest), so tcpSocket is the correct readiness signal.
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inference-engine
spec:
  selector:
    app: inference-engine
  ports:
    - port: 50052
      targetPort: 50052
      name: grpc
