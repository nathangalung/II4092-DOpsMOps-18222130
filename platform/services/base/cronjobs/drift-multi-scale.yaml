# =============================================================================
# DRIFT DETECTION — Multi-scale Monitoring (Python + scipy/numpy)
# =============================================================================
# Detects data drift and concept drift using PSI and KS tests at
# multiple time scales (minute, hourly, daily, weekly, monthly). Each scale
# compares the current window against the immediately preceding equal-length
# window (week vs prior week, month vs prior month) so results stay comparable.
#
# Platform tool integration:
#   - Grafana: Unified alerting on drift detection events
#   - Prometheus: Drift metrics exported via Pushgateway
#   - Great Expectations: Data quality validation on reference vs current
#   - Kafka: Drift events published to 'drift-events' topic
# =============================================================================
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-check-minute
  labels:
    app: drift-detector
    scale: minute
spec:
  schedule: "* * * * *" # Every minute
  # suspend declared explicitly: with ServerSideApply, a field git never sets
  # is owned by whoever patched it live — a manual `suspend: true` is invisible
  # to the ArgoCD diff (app stays Synced while the CronJob sleeps; #513 froze
  # 7 CronJobs for 14 days this way). Declaring it gives ArgoCD ownership, so
  # any out-of-band suspend self-heals on the next sync.
  #
  # DEFAULT-OFF on single-node: minute-scale drift over per-second market data is
  # statistical noise, and at 1 Job pod/minute (1440/day) it was a primary IO-
  # cascade driver on a single HDD. The meaningful comparable-timeline drift the
  # platform reports is daily/weekly/monthly (all kept on). A use case that truly
  # needs minute-granularity drift sets `suspend: false` in its overlay patch.
  suspend: true
  # Bounds missed-schedule lookback after unsuspend/downtime: without it the
  # controller counts every missed slot and hard-stops at >100 ("too many
  # missed start times") — a fast cron suspended >100 periods never fires
  # again. 300s = catch up at most the last 5 minutes, skip the rest.
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app: drift-detector
            scale: minute
        spec:
          restartPolicy: Never
          containers:
            - name: drift-detector
              image: drift-detector:latest
              imagePullPolicy: IfNotPresent
              # UV mandate (project policy): no `uv run python`, no `python -c`.
              # `uv run --no-sync main.py` runs the project entry point inside
              # the baked venv WITHOUT re-syncing (image built --no-editable, so
              # nothing to rebuild — air-gap safe). `--scale minute --once`
              # invokes the one-shot CronJob mode (see main.py:212-251).
              command: ["uv", "run", "--no-sync", "main.py"]
              args: ["--scale", "minute", "--once"]
              envFrom:
                - configMapRef:
                    name: pipeline-config
                - secretRef:
                    name: pipeline-secrets
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "200m"
                  memory: "512Mi"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-check-hourly
  labels:
    app: drift-detector
    scale: hourly
spec:
  schedule: "0 * * * *" # Hourly (was */15 = 96 Job pods/day; once/hour is ample
  # for hourly-window drift on a single-node platform and cuts that churn 4x).
  suspend: false # SSA-owned — see drift-check-minute header (#513)
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: drift-detector
            scale: hourly
        spec:
          restartPolicy: Never
          containers:
            - name: drift-detector
              image: drift-detector:latest
              imagePullPolicy: IfNotPresent
              command: ["uv", "run", "--no-sync", "main.py"]
              args: ["--scale", "hourly", "--once"]
              envFrom:
                - configMapRef:
                    name: pipeline-config
                - secretRef:
                    name: pipeline-secrets
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "1Gi"
