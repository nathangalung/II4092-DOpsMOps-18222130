# BATCH FEATURES - Hourly Feature Computation (Python)
# Computes rolling statistics, momentum, and volatility features
# from time-series data in ClickHouse and writes to features table.
#
# Platform tool integration:
#   - Airflow: Workflow orchestration via DAGs
#   - ClickHouse: SQL-based feature computation (window functions can
#     replace Python pandas transformations for simpler indicators)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-features
  labels:
    app: batch-processing
    schedule: hourly
spec:
  schedule: "30 * * * *" # 30 minutes after each hour
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: batch-processing
            job-type: feature-computation
        spec:
          restartPolicy: OnFailure
          containers:
            - name: batch-processing
              image: batch-processing:latest
              imagePullPolicy: IfNotPresent
              command: ["uv", "run", "--no-sync", "main.py"]
              args: ["--mode", "features"]
              envFrom:
                - configMapRef:
                    name: pipeline-config
                - secretRef:
                    name: pipeline-secrets
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
              # No /app/config mount by design. A use-case overlay image bakes
              # its feature config at /app/config/config.yaml (the Python loader's
              # default path when CONFIG_PATH is unset). A full-dir mount of the
              # flat pipeline-config ConfigMap here (no subPath, keys are
              # KEY=VALUE not a config.yaml) would clobber that dir, so loader finds
              # no config.yaml, so technical_indicators stays {}, so sma_*/
              # volatility_* write as ClickHouse DEFAULT 0. Every pipeline-config
              # value already reaches the container via envFrom above. This base
              # CronJob runs the no-bake platform image so the mount was inert,
              # but it is the exact reintroduction vector for an overlay image -
              # removed here too. See the use-case CONFIG_PATH fix.
