apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Istio 1.29.2 mesh: Knative ingress, KServe traffic, STRICT mTLS.
# istio-install.yaml is vendored istioctl output with hand edits: oauth2-proxy
# ext_authz provider (ADR-024), accessLogFile, tcpKeepalive, busybox override
# (ADR-006). Forward-port these on any bump; a stock re-render is not reproducible
# (CNIConfig --set schema drift). CRDs regenerated from istioctl 1.29.2.
resources:
  - istio-crds.yaml
  - istio-namespace.yaml
  - istio-install.yaml
  # Mesh-wide STRICT mTLS + deny-by-default AuthorizationPolicy at root
  # (KNF-07).  Installed after Istio CRDs are ready.
  - peer-authentication.yaml
