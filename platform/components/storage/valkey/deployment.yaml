apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: storage
spec:
  ports:
    - port: 6379
  selector:
    app: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: storage
  labels:
    app: valkey
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: mlops-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.0.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Shell form required: K8s $(VAR) only resolves env[] entries, not
          # envFrom values. `sh -c exec …` lets the shell expand at start.
          #
          # `--save "" --appendonly no`: run as a PURE IN-MEMORY cache (this is
          # the `component: cache` - contents are re-derivable, e.g. Flink-
          # computed features). REQUIRED on this pod: it has readOnlyRootFile
          # system=true and NO writable volume at the default data dir `/data`,
          # so the moment Valkey hits an RDB save point it fails with "Failed
          # opening the temp RDB file … Read-only file system" and with the
          # default `stop-writes-on-bgsave-error yes` it then BLOCKS ALL WRITES
          # (clients see `MISCONF Valkey is configured to save RDB snapshots,
          # but it's currently unable to persist to disk`). That silently broke
          # the Flink feature job (#feature to gold path). Disabling persistence
          # removes the bgsave attempt entirely and also drops needless disk IO
          # on the single-node disk. Need durability later? add a writable
          # emptyDir/PVC at /data and re-enable `save`.
          command: ["sh", "-c"]
          args:
            - 'exec valkey-server --requirepass "$VALKEY_PASSWORD" --save "" --appendonly no'
          envFrom:
            - secretRef:
                name: valkey-auth
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: valkey
  namespace: storage
  labels:
    app: valkey
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: valkey
