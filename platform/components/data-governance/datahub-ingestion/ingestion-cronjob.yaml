apiVersion: batch/v1
kind: CronJob
metadata: { name: datahub-ingest-kafka, namespace: data-governance }
spec:
  schedule: "0 * * * *"
  # Single-node HDD idle-default OFF: an ArgoCD reconcile wave coinciding with
  # this hourly ingest pod-spawn compounds IO on one spinning disk. Resume for a
  # live governance demo: kubectl -n data-governance patch cronjob
  # datahub-ingest-kafka --type merge -p '{"spec":{"suspend":false}}'.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 3600
      template:
