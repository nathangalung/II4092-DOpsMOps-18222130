# =============================================================================
# DataHub ingestion recipes — PG, ClickHouse, MinIO, Kafka, dbt, Feast, mlflow
# =============================================================================
# ADR-013.  One ConfigMap per source.  Recipes executed by a shared CronJob
# that iterates recipe files (see ingestion-cronjob.yaml).  Uses the
# DataHub Python ingestion framework (datahub[all] 1.5.0.1).
#
# Airflow is NOT in this list.  DataHub has no polling `source.type: airflow`
# (the `acryl-datahub-airflow-plugin` package only registers as an Airflow
# `airflow.plugins` / `apache_airflow_provider` — i.e. it runs INSIDE the
# Airflow scheduler/webserver and pushes lineage events on DAG runs).  The
# platform wires this push path directly: airflow Deployment carries
# OPENLINEAGE_URL + AIRFLOW__OPENLINEAGE__TRANSPORT pointing at
# `datahub-gms:/openapi/openlineage` (see platform/components/data-processing/
# airflow/deployment.yaml AIRFLOW__OPENLINEAGE__* env).  A polling recipe
# would aborts with `PipelineInitError: Did not find a registered class for
# airflow` because the source type does not exist in datahub-ingestion
# v1.5.0.1's plugin registry (verified 2026-05-11).
#
# OpenBao paths (Strategic-merged into recipes at runtime by init container):
#   secret/data/platform/datahub/admin    → GMS auth token
#   secret/data/platform/postgres/app
#   secret/data/platform/clickhouse/admin
#   secret/data/platform/minio/root
#   secret/data/platform/kafka/admin
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: datahub-ingestion-recipes
  namespace: data-governance
  labels:
    app: datahub
    component: ingestion
data:
  postgres.yml: |
    source:
      type: postgres
      config:
        host_port: postgresql-rw.storage.svc.cluster.local:5432
        database: platform
        username: ${PG_USER}
        password: ${PG_PASSWORD}
        include_tables: true
        include_views: true
        profiling: { enabled: true, limit: 10000 }
        # Classification DISABLED for the same reason as clickhouse.yml: the
        # datahub_classify info-type NER path fetches the spaCy en_core_web_sm
        # model from github.com at runtime, which the air-gapped istio-STRICT mesh
        # blocks -> SystemExit:1. This source passed before only because the empty
        # platform metadb never triggered the NER path; disabling it removes that
        # latent failure. Profiling (data-quality signal) stays on. Re-enable by
        # baking en_core_web_sm into the datahub-ingestion image.
        classification: { enabled: false }
    sink:
      type: datahub-rest
      config:
        server: http://datahub-gms.data-governance.svc.cluster.local:8080
        token: ${GMS_TOKEN}
    transformers:
      - type: simple_add_dataset_tags
        config:
          tag_urns: [ "urn:li:tag:layer:postgres", "urn:li:tag:classification:internal" ]

  clickhouse.yml: |
    source:
      type: clickhouse
      config:
        host_port: clickhouse-platform.storage.svc.cluster.local:8123
        username: ${CH_USER}
        password: ${CH_PASSWORD}
        include_tables: true
        include_views: true
        profiling: { enabled: true, include_field_stddev_value: true, limit: 50000 }
        # Classification (datahub_classify info-type NER) DISABLED. At runtime
        # datahub_classify.infotype_helper lazily downloads the spaCy model
        # `en_core_web_sm` (~12.8 MB) from github.com; this cluster is air-gapped
        # with istio STRICT egress, so the fetch fails and the classification
        # worker raises SystemExit:1, aborting the whole pipeline (verified
        # 2026-06-07). The data this platform catalogs carries no PII, so info-type
        # classification yields
        # nothing of value. Profiling — the data-quality governance signal (row
        # counts, null fraction, min/max/stddev) — is retained. To re-enable
        # classification, bake en_core_web_sm into the datahub-ingestion image so
        # no runtime egress is required.
        classification: { enabled: false }
    sink:
      type: datahub-rest
      config:
        server: http://datahub-gms.data-governance.svc.cluster.local:8080
        token: ${GMS_TOKEN}

  minio.yml: |
    source:
      type: s3
      config:
        aws_config:
          aws_endpoint_url: http://minio.storage.svc.cluster.local:9000
          aws_region: us-east-1
          aws_access_key_id: ${AWS_ACCESS_KEY_ID}
          aws_secret_access_key: ${AWS_SECRET_ACCESS_KEY}
        path_specs:
          - include: "s3://warehouse/*/*.parquet"
            default_extension: parquet
          - include: "s3://pipeline-artifacts/*/*.*"
        profiling: { enabled: false }
    sink:
      type: datahub-rest
      config:
        server: http://datahub-gms.data-governance.svc.cluster.local:8080
        token: ${GMS_TOKEN}

  kafka.yml: |
    source:
      type: kafka
      config:
        connection:
          bootstrap: platform-kafka-kafka-bootstrap.data-ingestion.svc.cluster.local:9092
          schema_registry_url: http://karapace.data-ingestion.svc.cluster.local:8081
        topic_patterns: { allow: [".*"], deny: ["__.*", "_schemas"] }
    sink:
      type: datahub-rest
      config:
        server: http://datahub-gms.data-governance.svc.cluster.local:8080
        token: ${GMS_TOKEN}

  dbt.yml: |
    source:
      type: dbt
      config:
        # Platform convention path: the use-case's dbt orchestration uploads
        # manifest/catalog/run_results to s3://pipeline-artifacts/dbt/target/
        # after every successful build (Airflow lakehouse DAG, dbt_run task).
        # s3 replaces the old dbt-artifacts PVC handoff, which was impossible:
        # dbt builds run in the use-case namespace and PVCs don't cross
        # namespaces, so the PVC sat Pending (WaitForFirstConsumer) forever
        # and this CronJob stayed suspended. The dbt source's
        # aws_connection_needed_if_s3_uris_present validator REQUIRES
        # aws_connection when any path is an s3 URI.
        manifest_path: s3://pipeline-artifacts/dbt/target/manifest.json
        catalog_path: s3://pipeline-artifacts/dbt/target/catalog.json
        run_results_paths: [ "s3://pipeline-artifacts/dbt/target/run_results.json" ]
        aws_connection:
          aws_endpoint_url: http://minio.storage.svc.cluster.local:9000
          aws_region: us-east-1
          aws_access_key_id: ${AWS_ACCESS_KEY_ID}
          aws_secret_access_key: ${AWS_SECRET_ACCESS_KEY}
        target_platform: clickhouse
        target_platform_instance: platform-clickhouse
        # Emits column-level lineage from dbt → ClickHouse.
    sink:
      type: datahub-rest
      config:
        server: http://datahub-gms.data-governance.svc.cluster.local:8080
        token: ${GMS_TOKEN}

  feast.yml: |
    source:
      type: feast
      config:
        # The CronJob's args block renders /tmp/feature_repo/feature_store.yaml
        # at pod start (envsubst over the platform's feast template using
        # CLICKHOUSE_USER/CLICKHOUSE_PASSWORD/VALKEY_PASSWORD from
        # datahub-ingestion-env).  We can't mount the feast-feature-repo
        # ConfigMap from `model-lifecycle` cross-namespace, so synthesise it
        # locally with the same connection coordinates as the live feast
        # Deployment.  Keep this path aligned with the CronJob's mkdir.
        path: /tmp/feature_repo
        environment: prod
    sink:
      type: datahub-rest
      config:
        server: http://datahub-gms.data-governance.svc.cluster.local:8080
        token: ${GMS_TOKEN}

  mlflow.yml: |
    source:
      type: mlflow
      config:
        tracking_uri: http://mlflow.model-lifecycle.svc.cluster.local:5000
        registry_uri: http://mlflow.model-lifecycle.svc.cluster.local:5000
    sink:
      type: datahub-rest
      config:
        server: http://datahub-gms.data-governance.svc.cluster.local:8080
        token: ${GMS_TOKEN}
