apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datahub-gms
  namespace: data-governance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datahub-gms
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
# datahub-frontend autoscaling lives in scaledobject.yaml (KEDA cron
# scale-to-zero). KEDA emits its own keda-hpa-datahub-frontend and refuses to
# reconcile alongside a plain HPA on the same Deployment, so the frontend HPA
# that used to sit here was removed. gms + actions keep plain CPU HPAs below
# (data-path; they do not scale to zero).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datahub-actions
  namespace: data-governance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datahub-actions
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
