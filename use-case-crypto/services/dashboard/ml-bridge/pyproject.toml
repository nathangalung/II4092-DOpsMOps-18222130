[project]
name = "ml-bridge"
version = "1.0.0"
description = "ML Bridge API service for features and predictions"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.30.6",
    "httpx>=0.28.1",
    # Feast S3 file registry + Valkey online store; clickhouse extra pulls the offline-store
    # contrib + clickhouse-connect (definitions.py imports ClickhouseSource at load time).
    "feast[clickhouse,redis]>=0.61.0",
    # Feast's clickhouse offline-store module imports both `psycopg` AND
    # `psycopg_pool` at import time, but `feast[clickhouse]` pulls neither.
    # FeatureStore(repo_path) eagerly imports the offline_store config class
    # declared in feature_store.yaml (clickhouse) even though the reader only
    # reads the Valkey online store, so both imports must resolve or `/latest`
    # 500s with FeastModuleImportError ("No module named 'psycopg_pool'"). The
    # `binary` extra bundles libpq; the `pool` extra pulls `psycopg-pool`
    # (module `psycopg_pool`). Mirrors the materialization writer (#502).
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.12.0",
    # boto3 for Feast's S3 file registry (registry_type: file, path: s3://feast/...).
    # feast[clickhouse,redis] does NOT pull an S3 client; S3RegistryStore needs it
    # to read the registry proto the materialization writer populates.
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = ["pytest>=8.3.4", "pytest-cov>=6.0.0", "pytest-mock>=3.14.0", "pytest-asyncio>=0.25.0", "httpx>=0.28.1", "ruff>=0.8.4"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=. --cov-report=term-missing"
asyncio_mode = "auto"
