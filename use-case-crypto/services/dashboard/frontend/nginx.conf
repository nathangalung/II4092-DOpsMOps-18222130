server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — all non-file requests fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the Go BFF (dashboard-backend Service), NOT localhost
    # — nginx here listens on 8080 too, so proxy_pass to localhost:8080 self-looped
    # and never reached the backend. The SPA calls same-origin /api/v1/* (frontend
    # api.ts API_BASE_URL); the Go BFF groups routes under /api/ (cmd/main.go:64),
    # so the trailing /api/ on proxy_pass strips the /v1 segment: a request for
    # /api/v1/predictions is forwarded to dashboard-backend:8080/api/predictions.
    location /api/v1/ {
        proxy_pass http://dashboard-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade for the live-prediction stream
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
