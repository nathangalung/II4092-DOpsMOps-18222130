[project]
name = "unified-sdk-walkthrough"
version = "0.1.0"
description = "Notebook klien terpadu KF-13: Feast, MLflow, klien KServe v2"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3>=1.34",
    "feast[clickhouse,redis]>=0.61.0",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "mlflow>=3.10.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.12.0",
]

# Batas versi April 2026 (invariant platform).
[tool.uv]
exclude-newer = "2026-05-01T00:00:00Z"
