version: 2

models:
  - name: fct_ohlcv_features
    description: "OHLCV with the full technical-indicator matrix — SMA/EMA, MACD, RSI, Bollinger Bands, ATR, Stochastic, Williams %R, ROC, momentum, OBV, returns, volatility (gold layer; batch counterpart of the Flink stream feature set)"
    columns:
      - name: symbol
        tests:
          - not_null
      - name: timestamp
        tests:
          - not_null
      - name: close
        tests:
          - not_null
      - name: volume_sma_20
        description: "Trailing 20-event volume mean — parity anchor against the stream feature `secondary_avg` (KF-11; see experiments/parity/)"
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - timestamp

  - name: fct_sentiment_agg
    description: "Windowed sentiment aggregations per symbol (gold layer)"
    columns:
      - name: symbol
        tests:
          - not_null

  - name: dim_fear_greed
    description: "Daily Fear & Greed index values"
    columns:
      - name: date
        tests:
          - not_null
          - unique

  - name: fct_training_data
    description: "Combined OHLCV + sentiment + fear & greed for ML training"
    columns:
      - name: symbol
        tests:
          - not_null
      - name: timestamp
        tests:
          - not_null
      - name: close
        tests:
          - not_null
