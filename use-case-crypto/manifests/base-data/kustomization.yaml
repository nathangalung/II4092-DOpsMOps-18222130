# =============================================================================
# PHASE 1 BASE — Ingestion + Quality + Processing ONLY
# =============================================================================
# Pulls the Data subset of the platform Deployments + crypto CRs that are
# needed to run ingestion → quality → processing. Train/3/4 resources are
# NOT included — no unnecessary image pulls.
#
# Paths: `../../../platform/...` cross-repo references REQUIRE
# `kubectl kustomize --load-restrictor LoadRestrictionsNone` (see Makefile
# data-apply target).
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace here so siblings survive
namespace: use-case-crypto

resources:
  # --- Infrastructure (platform base ConfigMap + crypto namespace/secrets) ---
  - ../../../platform/services/base/pipeline-infrastructure-configmap.yaml
  - ../base/namespace.yaml
  - ../base/configmaps/feast.yaml
  - ../base/configmaps/rest-collector-config.yaml
  - ../base/external-secrets.yaml
  - ../base/schema-registration.yaml
  # Kafka Connect connectors removed from this use case (Debezium CDC = wrong
  # tool for an API source; the Iceberg-sink is superseded by the Spark-batch
  # Iceberg writer — see manifests/base/spark/ — NOT by Flink, which sinks only
  # to Kafka + Valkey and writes zero Iceberg). See the rationale in
  # ../base/kustomization.yaml. Platform retains the capability.
  # KEDA TriggerAuthentication stays in use-case-crypto. KafkaUsers moved to
  # cross-namespace-data so the namespace setter above does not clobber their
  # explicit data-ingestion namespace (Strimzi User Operator watches there).
  - ../base/kafka-users/triggerauth.yaml

  # --- Data: Ingestion (platform Deployments + crypto CronJobs) ---
  - ../../../platform/services/base/deployments/rest-collector.yaml
  - ../../../platform/services/base/deployments/websocket-collector.yaml
  - ../base/cronjobs/supplementary.yaml
  - ../base/cronjobs/supplementary-feargreed.yaml
  - ../base/cronjobs/supplementary-coingecko.yaml
  - ../base/cronjobs/supplementary-defillama.yaml

  # --- Data: Quality ---
  - ../../../platform/services/base/deployments/validator.yaml
  - ../../../platform/services/base/deployments/analyzer.yaml

  # --- Data: Processing ---
  # Flink stream-processor (generic flink-job image) is the speed layer:
  # crypto.validated → OHLCV features → online `features:{symbol}` Valkey
  # cache + crypto.features.v1 (ADR-027 End-state Y; the Rust feature-engine
  # was retired). Self-contains its ServiceAccount/Role/RoleBinding and the
  # flink-s3-secret ExternalSecret.
  - ../base/flink/stream-processor.yaml
  - ../base/cronjobs/vector-embedding.yaml
  # batch-features, batch-sentiment, dbt-run, backfill → Airflow DAGs

  # --- Data: Lakehouse (Spark → Iceberg cold archive via Lakekeeper) ---
  # Activates spark-operator + Iceberg + Lakekeeper + Trino as a NON-redundant
  # tier: ClickHouse = hot warehouse, Iceberg-on-MinIO = cold open archive of raw
  # ticks, Trino = federation across both. 6-hourly ScheduledSparkApplication, no
  # custom image (reuses apache/spark + --packages jars), idle Spark pods = 0.
  - ../base/lakehouse/warehouse-bootstrap.yaml
  - ../base/spark/rbac.yaml
  - ../base/spark/archive-script.yaml
  - ../base/spark/trades-archive.yaml

  # --- RBAC (platform Roles/Bindings + crypto-scoped ServiceAccount) ---
  - ../../../platform/services/base/rbac/roles.yaml
  - ../../../platform/services/base/rbac/bindings.yaml
  - ../base/rbac/service-account.yaml

patches:
  # schema.yaml is the SINGLE SOURCE OF TRUTH for feature names, symbols,
  # table names, and data sources. Must be first so other patches can override.
  - path: ../base/configmaps/schema.yaml
  - path: ../base/configmaps/identity.yaml
  - path: ../base/configmaps/topics.yaml
  - path: ../base/configmaps/sources.yaml
  - path: ../base/configmaps/features.yaml
  - path: ../base/configmaps/models.yaml
  - path: ../base/configmaps/quality.yaml
  - path: ../base/configmaps/serving.yaml
  - path: ../base/patches/rest-collector.yaml
  - path: ../base/patches/supplementary-source.yaml
  # backfill.yaml removed: targeted nonexistent CronJob "incremental-backfill".
  # Backfill is handled by rest-collector's built-in HISTORY_BACKFILL_ON_START.
  - path: ../base/patches/websocket-collector.yaml
  # SCRAM/TLS Kafka credentials for validator + analyzer + rest-collector +
  # websocket-collector (the Flink stream-processor gets SCRAM via the
  # crypto-app-consumer Secret envFrom on its podTemplate, not this patch).
  # Must come last so it composes with the per-service patches above
  # (kustomize merges by container name).
  - path: ../base/patches/kafka-sasl.yaml

# Teach kustomize's image transformer to rewrite the FlinkDeployment's
# CRD-level `spec/image` — the builtin transformer only walks PodSpec
# images, so without this the overlay's `flink-job → crypto-flink-job`
# remap silently no-ops and the base `flink-job` placeholder is pulled.
# Mirrors base/kustomization.yaml.
configurations:
  - ../base/kustomize-config/name-reference.yaml

labels:
  - pairs:
      app.kubernetes.io/component: ml-pipeline
      app.kubernetes.io/part-of: mlops-platform
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
