# =============================================================================
# LOCAL PHASE 1 OVERLAY — Only Ingestion + Quality + Processing
# =============================================================================
# References base/kustomization-data.yaml instead of base/kustomization.yaml
# so Train/3/4 resources are never created (no unnecessary image pulls).
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: crypto-
namespace: use-case-crypto

resources:
  - ../../base-data

labels:
  - pairs:
      app.kubernetes.io/name: crypto-pipeline
      environment: development
      platform: k3s
    includeSelectors: true

# Image name mapping — Data only. Tags pinned to `dev` so base
# `:latest` placeholder is fully overridden; bumping a phase service
# is an overlay-edit only.
images:
  # Ingestion
  - name: rest-collector
    newName: localhost:5000/crypto-rest-collector
    newTag: latest
  - name: websocket-collector
    newName: localhost:5000/crypto-websocket-collector
    newTag: latest
  # Quality
  - name: validator
    newName: localhost:5000/crypto-validator
    newTag: latest
  - name: analyzer
    newName: localhost:5000/crypto-analyzer
    newTag: latest
  # Processing — Flink stream-processor. Base FlinkDeployment references the
  # generic platform image name `flink-job`; this maps it to the crypto-tagged
  # registry ref. The spec/image rewrite on the FlinkDeployment CR is enabled
  # by the `images:` FieldSpec in base/kustomize-config/name-reference.yaml.
  - name: flink-job
    newName: localhost:5000/crypto-flink-job
    newTag: latest
  - name: batch-processing
    newName: localhost:5000/crypto-batch-processing
    newTag: latest
  - name: vector-processing
    newName: localhost:5000/crypto-vector-processing
    newTag: latest
  # dbt
  - name: dbt-project
    newName: localhost:5000/crypto-dbt-project
    newTag: latest

replicas:
  - name: rest-collector
    count: 1
  - name: websocket-collector
    count: 1
  - name: validator
    count: 1
  - name: analyzer
    count: 1
  # Flink JM/TM replica counts live on the FlinkDeployment CR
  # (jobManager.replicas / taskManager.replicas); kustomize `replicas:` only
  # supports Deployment/StatefulSet/ReplicaSet/Rollout, not FlinkDeployment.

patches:
  # Always — forces registry digest check on each pod create. IfNotPresent
  # silently ran stale cached containerd layers after `make usecase-crypto-
  # build` re-pushed `:latest`, hiding new env-var reads (VALKEY_PASSWORD,
  # KAFKA_SASL_*) and producing NOAUTH at Valkey + SASL handshakes failures.
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: CronJob
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Rollout
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # Reduce resources for VPS (limited node resources)
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
  - target:
      kind: CronJob
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"

  # Flink stream-processor resources are sized on the FlinkDeployment CR
  # (jobManager/taskManager.resource), not a Deployment-shaped patch; the old
  # feature-engine reduction patch is removed (mirrors overlays/local).
  - target:
      kind: Deployment
      name: analyzer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
  # batch-features CronJob removed — superseded by Airflow DAG crypto_hourly_features
  - target:
      kind: CronJob
      name: vector-embedding
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
