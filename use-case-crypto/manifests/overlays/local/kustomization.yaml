# =============================================================================
# LOCAL OVERLAY (k3s Development)
# =============================================================================
# Uses base configuration. To disable services, edit base/kustomization.yaml.
#
# Usage:
#   kubectl apply -k manifests/overlays/local
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# =============================================================================
# USE-CASE CONFIGURATION — Change these values for a new use case:
#   1. namePrefix    → your use-case prefix (e.g., crypto-)
#   2. commonLabels  → app.kubernetes.io/name (e.g., crypto-pipeline)
#   3. images        → newName prefix matches USE_CASE_NAME in Makefile
# =============================================================================
# `namespace:` MOVED to base/kustomization.yaml so cross-namespace resources
# (`../../cross-namespace/`) keep their explicit `metadata.namespace` values
# (data-ingestion, istio-system, velero, model-lifecycle).
namePrefix: crypto-

resources:
  - ../../base
  - ../../cross-namespace

# Secret generator for KServe storage credentials.
# Reads from .env file so credentials are never committed to Git.
# The generated secret name is crypto-kserve-storage-secret (after namePrefix).
# Secrets are provisioned by ExternalSecrets from Vault (ADR-008).  See
# manifests/base/external-secrets.yaml for the ExternalSecret CRs that
# replace the previous inline-literal `secretGenerator`.
#
# Why: storing JWT_SECRET, POSTGRES_PASSWORD, S3_*, MLFLOW_TRACKING_PASSWORD
# as plaintext literals leaked production-like values into Git — violates
# KNF-07 (secrets management).  Each rotation required a Git commit.
#
# For developer-loop convenience, `.env` at repo root is mounted into the
# Vault-init Job as the seed when the Vault is first bootstrapped; after
# that, Vault is the source of truth.
generatorOptions:
  disableNameSuffixHash: true

# Local development labels
labels:
  - pairs:
      app.kubernetes.io/name: crypto-pipeline
      environment: development
      platform: k3s
    includeSelectors: true
    # Same Rollout pod-template carve-out as base/kustomization.yaml:
    # kustomize doesn't know the Rollout CRD's template path, so without
    # this the Service selector gains these pairs but Rollout pods don't.
    fields:
      - path: spec/template/metadata/labels
        kind: Rollout
        group: argoproj.io
        create: true

# Image name mapping: base uses generic names with a `:latest` placeholder
# tag. Overlay sets newName + newTag — production-pin semver here in cloud,
# `dev` (or any rolling tag) in local. Bumping a version means editing this
# block only; base manifests are not touched. Matches Makefile USE_CASE_PREFIX
# / VERSION conventions.
images:
  # Ingestion
  - name: rest-collector
    newName: localhost:5000/crypto-rest-collector
    newTag: latest
  - name: websocket-collector
    newName: localhost:5000/crypto-websocket-collector
    newTag: latest
  # Quality
  - name: validator
    newName: localhost:5000/crypto-validator
    newTag: latest
  - name: analyzer
    newName: localhost:5000/crypto-analyzer
    newTag: latest
  # Processing — Flink stream-processor. Base FlinkDeployment references the
  # generic platform image name `flink-job`; this maps it to the crypto-tagged
  # registry ref. The spec/image rewrite on the FlinkDeployment CR is enabled by
  # the `images:` FieldSpec in base/kustomize-config/name-reference.yaml.
  - name: flink-job
    newName: localhost:5000/crypto-flink-job
    newTag: latest
  # Batch/Vector — no standing Deployments. `batch-processing` runs as a
  # KubernetesPodOperator in Airflow DAG crypto_hourly_features (the DAG
  # sets the full image ref inline, so no Kustomize mapping is needed).
  # `vector-processing` is consumed by the CronJob `vector-embedding`,
  # which still needs its image rewritten for single-node registry.
  - name: vector-processing
    newName: localhost:5000/crypto-vector-processing
    newTag: latest
  # Training
  - name: trainer
    newName: localhost:5000/crypto-trainer
    newTag: latest
  - name: drift-detector
    newName: localhost:5000/crypto-drift-detector
    newTag: latest
  # Serving
  - name: gateway
    newName: localhost:5000/crypto-gateway
    newTag: latest
  # inference-engine: crypto serves via KServe InferenceService (crypto-predictor),
  #   not the platform C++ engine — disabled in config/services.yaml (no image
  #   built/retagged, no Deployment rendered). Rename entry removed (matched nothing).
  # scoring: removed platform-wide — gateway's built-in scoring endpoint + the
  #   ml-bridge batch-score task replaced it.
  # Observability
  - name: drift-reporter
    newName: localhost:5000/crypto-drift-reporter
    newTag: latest
  # Automation
  - name: materialization
    newName: localhost:5000/crypto-materialization
    newTag: latest
  # Dashboard
  - name: dashboard-backend
    newName: localhost:5000/crypto-dashboard-backend
    newTag: latest
  - name: dashboard-frontend
    newName: localhost:5000/crypto-dashboard-frontend
    newTag: latest
  - name: ml-bridge
    newName: localhost:5000/crypto-ml-bridge
    newTag: latest
  # dbt
  - name: dbt-project
    newName: localhost:5000/crypto-dbt-project
    newTag: latest

# Single replicas for local development
replicas:
  # Ingestion
  - name: rest-collector
    count: 1
  - name: websocket-collector
    count: 1
  # Quality
  - name: validator
    count: 1
  - name: analyzer
    count: 1
  # Processing — Flink JM/TM replica counts live on the FlinkDeployment CR
  # (jobManager.replicas / taskManager.replicas); kustomize `replicas:` only
  # supports Deployment/StatefulSet/ReplicaSet/Rollout, not FlinkDeployment.
  # Serving
  - name: gateway
    count: 1
  # inference-engine replaced by KServe InferenceService
  # Dashboard
  - name: dashboard-backend
    count: 1
  - name: dashboard-frontend
    count: 1
  # ADR-025: ml-bridge has no Deployment/StatefulSet — pod lifecycle is on
  # the Argo Rollout (rollouts/ml-bridge-rollout.yaml). Kustomize `replicas:`
  # does not support `Rollout` kind; set replicas on the Rollout spec itself.

patches:
  # =========================================================================
  # namePrefix cross-reference fixes — Kustomize namePrefix: crypto-
  # renames metadata.name but NOT string fields inside CRD specs.
  # These patches correct serviceAccountName and secret references.
  # =========================================================================

  # Fix KServe InferenceService → ServiceAccount reference.
  # Patch target is the BASE name (`predictor`); kustomize resolves the
  # effective target after namePrefix is applied. Rendered IS name is
  # `crypto-predictor`.
  - target:
      group: serving.kserve.io
      version: v1beta1
      kind: InferenceService
      name: predictor
    patch: |-
      - op: replace
        path: /spec/predictor/serviceAccountName
        value: crypto-kserve-sa

  # Fix KServe ServiceAccount → Secret reference
  - target:
      kind: ServiceAccount
      name: kserve-sa
    patch: |-
      - op: replace
        path: /secrets/0/name
        value: crypto-kserve-storage-secret

  # Fix ExternalSecret target.name — kustomize namePrefix prefixes metadata.name
  # but NOT spec.target.name (not a nameReference). SA expects
  # `crypto-kserve-storage-secret`; without this patch ESO renders Secret as
  # `kserve-storage-secret` and the storage-initializer can't find creds.
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: kserve-storage-secret
    patch: |-
      - op: replace
        path: /spec/target/name
        value: crypto-kserve-storage-secret

  # NOTE: no EventListener serviceAccountName patch here. A previous patch
  # targeted `name: crypto-build-listener`, but `patches:` match PRE-prefix
  # names (the working RoleBinding patches below target un-prefixed names),
  # so it never applied and the listener pod failed with
  # `serviceaccount "tekton-triggers-sa" not found`. The rename is now done
  # by the nameReference rule in base/kustomize-config/name-reference.yaml.

  # Fix Tekton RoleBinding → ServiceAccount subject name
  - target:
      kind: RoleBinding
      name: tekton-triggers-binding
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: crypto-tekton-triggers-sa

  # Fix Tekton ClusterRoleBinding → ServiceAccount subject name
  - target:
      kind: ClusterRoleBinding
      name: tekton-triggers-binding
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: crypto-tekton-triggers-sa

  # =========================================================================
  # Image pull policy
  # =========================================================================
  #
  # Always (not IfNotPresent) on the `:latest`-tagged crypto images so each
  # pod create does a registry digest check. Without this, kubelet kept a
  # stale containerd layer that pre-dated VALKEY_PASSWORD + KAFKA_SASL_* env
  # reads, so the Flink TM ran a stale jar against a correctly-populated
  # Secret and got NOAUTH from Valkey. localhost:5000 is on-node, so the
  # digest check cost is negligible for long-lived workloads.
  #
  # #402: CronJobs are intentionally excluded from the Always-blanket. Every
  # fire of a CronJob spawns a fresh pod and re-pays the local-registry pull
  # under IO contention — 18+ min measured on cold cache (rest-collector image,
  # see #167 / #402 forensics). Each cronjob base file pins IfNotPresent
  # explicitly so the first cold-cache fire pays once and warm-cache reruns
  # finish in seconds.
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Rollout
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # =========================================================================
  # Reduce memory requests for minikube (limited node resources)
  # Base values are for production; local dev needs smaller footprint
  # =========================================================================

  # Processing — the Flink stream-processor's resources are sized on the
  # FlinkDeployment CR (jobManager/taskManager.resource); no Deployment-shaped
  # resource patch applies. The old feature-engine reduction patch is removed.
  # Quality - reduce analyzer
  - target:
      kind: Deployment
      name: analyzer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"

  # Serving - gateway base requests 500m/1Gi, too heavy for single-node
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"

  # CronJobs - reduce heavy jobs
  # batch-features CronJob removed — superseded by Airflow DAG crypto_hourly_features
  # vector-embedding loads sentence-transformers/all-mpnet-base-v2 (~420MB
  # safetensors). PyTorch + transformers + tokenizer peak RSS during first
  # load is ~1.8-2.2GB; 1Gi limit OOMKills mid-load. Bump to 2.5Gi limit;
  # base ADS=1800 (#402) is sufficient — overlay no longer overrides it.
  - target:
      kind: CronJob
      name: vector-embedding
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/limits/memory
        value: "2500Mi"

  # =========================================================================
  # KafkaTopic replicas — base defines RF=3 for HA; single-broker needs RF=1.
  # The platform overlay patches `platform-events` only; these target all
  # use-case topics via labelSelector. min.insync.replicas must also drop to 1.
  # =========================================================================
  - target:
      group: kafka.strimzi.io
      version: v1beta2
      kind: KafkaTopic
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/config/min.insync.replicas
        value: "1"

  # =========================================================================
  # HPA caps for VPS (single node — cap maxReplicas to 3)
  # Production values are higher in base; VPS must fit on 16 CPU / 64 GB
  # =========================================================================
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3
      - op: replace
        path: /spec/minReplicas
        value: 1
