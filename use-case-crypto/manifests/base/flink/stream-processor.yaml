# use-case-crypto :: Stream-processing FlinkDeployment (Apache Flink Operator)
# Canonical speed-layer for the crypto use case. The Flink Kubernetes Operator
# (platform/components/data-processing/flink/flink-operator.yaml, cluster-wide
# watch) reconciles this application-mode FlinkDeployment and submits the
# platform `flink-job` fat JAR's main class (pipeline.StreamJob).
#
# WHY FLINK OWNS THE SPEED LAYER (vs the legacy Rust feature-engine):
#   - one engine for the entire streaming feature path (no second bespoke
#     consumer to operate/observe/scale) - "every tool a non-overlapping job"
#   - exactly-once Kafka-to-Kafka with Flink-managed transactions + RocksDB state
#     checkpointed to MinIO (feature-engine had at-most-once, no replayable
#     state) - showcases k8s/operator strength over a plain Deployment
#   - declarative lifecycle: savepoint-triggered upgrades, HA via K8s leases,
#     reconcile loop, first-party app-mode job submission
#   - lineage to DataHub (OpenLineage) + uniform Prometheus metrics (port 9249)
#
# DOMAIN-AGNOSTIC SPLIT (platform stays crypto-blind):
#   The platform StreamJob is a generic harness - it wires N streams purely
#   from env (ENABLED_STREAMS + STREAM_<NAME>_* keys). ALL crypto specifics
#   (which topic, which feature function, which sink, the online-cache key
#   prefix) live in this use-case file's podTemplate env + the inherited
#   pipeline-config (configmaps/features.yaml supplies the FLINK_* indicator
#   knobs). A new use case copies use-case-crypto/, edits these env values, and
#   reuses the same platform image - zero platform edits.
#
# DUAL SINK (lambda speed layer):
#   1. Kafka  crypto.features.v1  (EXACTLY_ONCE, txn id prefix crypto.flink-*)
#      to ClickHouse bronze via the Kafka engine table (init_clickhouse.sql),
#        and the batch and stream parity oracle (experiments/, SK-F-11/KF-11).
#   2. Valkey features:{symbol}   (online low-latency cache for serving) -
#      enabled by STREAM_TIME_SERIES_KEY_PREFIX; StreamJob emits a side-output
#      to the Lettuce RedisSink keyed by the JSON `symbol` field.
#
# IMAGE (overlay-rewritten, same pattern as every other service):
#   base references the generic `flink-job` name; overlays/local maps it to
#   localhost:5000/crypto-flink-job:latest via the `images:` block. The CRD
#   field spec/image is NOT a PodSpec container path, so kustomize's image
#   transformer is taught to rewrite it via the `images:` FieldSpec in
#   kustomize-config/name-reference.yaml. imagePullPolicy: Always so each pod
#   create does a registry digest check (the `:latest` tag is rebuilt every
#   `make usecase-crypto-build`; IfNotPresent silently ran a stale jar).
#
# SECRET PLUMBING (ExternalSecret is namespace-scoped, so replicated here):
#   flink-s3-secret  maps to MinIO checkpoint/HA creds (platform/minio/root)
#   pipeline-config  maps to KAFKA_BROKERS + FLINK_* knobs (inherited, prefixed)
#   pipeline-secrets maps to VALKEY_PASSWORD, CLICKHOUSE_*, AWS/S3 (raw target.name)
#   crypto-app-consumer maps to KAFKA_SASL_USERNAME/_PASSWORD + ca.crt (SCRAM/TLS)
---
# Flink SA + RBAC - the operator runs the JM/TM pods under this SA in the
#     namespace the FlinkDeployment lives in. namePrefix renames it to
#     `crypto-flink`; the FlinkDeployment.spec.serviceAccount reference is
#     rewritten in lockstep by the nameReference rule in kustomize-config.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: use-case-crypto
  labels:
    app: flink
    app.kubernetes.io/part-of: mlops-platform
    use-case: crypto
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: use-case-crypto
# Verbs required by Flink-native Kubernetes application-mode RM:
#   - configmaps: HA lease persistence + JM<->TM config exchange
#   - pods: full CRUD because the JM directly drives TM pod lifecycle (no
#     Deployment controller in between - it's an "ActiveResourceManager")
#   - services: create JM REST + RPC ClusterIPs at startup
#   - events: emit operator-visible events (optional but expected)
#   - deployments.apps: GET only - JM reads its own Deployment to derive the
#     owner reference stamped on every TM pod (so they GC when the JM is gone)
#   - leases: kubernetes-HA leader election (high-availability.type=kubernetes)
# Spec: https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/deployment/resource-providers/native_kubernetes/#rbac
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: use-case-crypto
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: use-case-crypto
---
# S3/MinIO credentials for Flink checkpoints + HA (ADR-008 ESO pattern).
#     target.name stays `flink-s3-secret` (raw) so the podTemplate secretRef
#     below resolves without a namePrefix rewrite (mirrors pipeline-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flink-s3-secret
  namespace: use-case-crypto
  labels:
    app: flink
    app.kubernetes.io/part-of: mlops-platform
    use-case: crypto
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-openbao
    kind: ClusterSecretStore
  target:
    name: flink-s3-secret
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef: { key: platform/minio/root, property: username }
    - secretKey: S3_SECRET_KEY
      remoteRef: { key: platform/minio/root, property: password }
---
# The crypto stream-processor FlinkDeployment (application mode)
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: stream-processor
  namespace: use-case-crypto
  labels:
    app.kubernetes.io/part-of: mlops-platform
    app.kubernetes.io/component: stream-processing
    use-case: crypto
spec:
  # Generic platform image name - overlays/local rewrites it to
  # localhost:5000/crypto-flink-job:latest (see header IMAGE note).
  image: flink-job
  imagePullPolicy: Always
  flinkVersion: v2_2
  serviceAccount: flink

  flinkConfiguration:
    # One stream (time_series) at parallelism 2 over the 6-partition
    # crypto.validated topic (3 partitions per subtask). numberOfTaskSlots=4
    # leaves 2 idle slots so a real-load parallelism bump (2 to 4) scales IN
    # PLACE on the single TM pod - demonstrating Flink/k8s elasticity without
    # breaching the single-node "1 pod at idle" invariant (CLAUDE.md).
    parallelism.default: "2"
    taskmanager.numberOfTaskSlots: "4"

    # Operator job-autoscaler (default ON in operator 1.13+) rewrites
    # parallelism mid-flight off backpressure noise on idle topics, spinning a
    # second TM pod and violating the idle=1-pod invariant. Disable here; KEDA
    # on Kafka-lag (scaling/scaledobjects.yaml) is the right use-case-aware
    # autoscaler for real load.
    job.autoscaler.enabled: "false"

    # JM heap headroom. Operator derives jobmanager.memory.process.size from
    # jobManager.resource.memory; JVM layout leaves heap ≈ process − ~25%.
    # Sized for the 1-stream / parallelism-2 ExecutionGraph (~4 subtasks incl.
    # sinks) - far lighter than the historical 3-stream graph, so 2560m process
    # (~1.9 GiB heap) is ample with off-heap raised for Kafka AdminClient +
    # S3 multipart buffers.
    jobmanager.memory.off-heap.size: "256m"
    jobmanager.memory.jvm-overhead.fraction: "0.15"

    # State backend + checkpoint/savepoint storage to MinIO (rocksdb so the
    # rolling-window feature state survives TM restarts and replays exactly).
    state.backend.type: rocksdb
    state.checkpoints.dir: s3://flink-checkpoints/crypto/
    state.savepoints.dir: s3://flink-savepoints/crypto/
    execution.checkpointing.interval: "60000"          # 60s
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.timeout: "600000"          # 10m
    execution.checkpointing.min-pause-between-checkpoints: "30000"

    # Heartbeat + restart tuning for a single-node cluster under transient disk
    # pressure: triple the heartbeat timeout (a TM with a stuck disk-write gets
    # one more chance), exponential restart back-off (10s to 5min breaks a flap
    # loop the fixed 1s default would hammer), and a 1h clean-run reset so a
    # transient incident doesn't pin the job at the 5-min ceiling forever.
    heartbeat.timeout: "180000"
    heartbeat.interval: "30000"
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: "10 s"
    restart-strategy.exponential-delay.max-backoff: "5 min"
    restart-strategy.exponential-delay.backoff-multiplier: "2.0"
    restart-strategy.exponential-delay.reset-backoff-threshold: "1 h"
    restart-strategy.exponential-delay.jitter-factor: "0.1"

    # S3 client: default hadoop-aws pool is tiny (15) with unbounded request
    # timeout, so a MinIO hiccup during checkpoint listing blocks the JM
    # heartbeat thread, so the operator misreads a dead leader and recycles. 100-conn
    # pool + 60s timeouts fail fast and let the next checkpoint cycle recover.
    s3.connection.maximum: "100"
    s3.connection.request.timeout: "60000"
    s3.socket.timeout: "60000"

    # Kubernetes-native HA (lease-based leader election). kubernetes.cluster-id
    # is set implicitly by the operator from metadata.name; the validation
    # webhook rejects user-provided kubernetes.* keys.
    high-availability.type: kubernetes
    high-availability.storageDir: s3://flink-ha/crypto/

    # MinIO S3 endpoint + path-style addressing (creds via AWS_* env below).
    s3.endpoint: http://minio.storage.svc.cluster.local:9000
    s3.path.style.access: "true"

    # OpenLineage to DataHub GMS: the bronze table this job produces appears as
    # a downstream dataset in the lakehouse catalog (governance coupling).
    execution.attached: "true"
    pipeline.openlineage.url: http://datahub-gms.data-governance.svc.cluster.local:8080/openapi/openlineage
    pipeline.openlineage.namespace: crypto-flink

    # Prometheus reporter so kube-prometheus-stack scrapes JM + TM uniformly
    # (port 9249 declared on the container + allowed in network-policies.yaml).
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"

  podTemplate:
    metadata:
      labels:
        # Stable scrape/policy handle on the JM + TM pods: selected by the Flink
        # PodMonitor (observability/servicemonitors.yaml, port 9249). Operator-
        # preserved and untouched by namePrefix/commonLabels (CRD-nested path),
        # unlike the operator-derived `app: crypto-stream-processor` cluster-id
        # label which only exists post-prefix.
        metrics: flink
    spec:
      # Strimzi cluster CA (PEM) for the SASL_SSL broker listener - mounted at
      # /etc/kafka/ca/ca.crt, consumed by StreamJob via KAFKA_SSL_CA_LOCATION
      # (topics.yaml). crypto-app-consumer is the user-namespace ESO replica of
      # the Strimzi KafkaUser secret.
      volumes:
        - name: kafka-ca
          secret:
            secretName: crypto-app-consumer
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: flink-main-container
          # 9249 = Prometheus reporter (scraped by the ServiceMonitor); 8081 =
          # JobManager REST API the operator binds on the JM.
          ports:
            - name: metrics
              containerPort: 9249
              protocol: TCP
            - name: jm-rest
              containerPort: 8081
              protocol: TCP
          envFrom:
            # pipeline-config (prefixed to crypto-pipeline-config by the
            # nameReference rule): KAFKA_BROKERS, KAFKA_SECURITY_PROTOCOL,
            # KAFKA_SASL_MECHANISM, KAFKA_SSL_CA_LOCATION, OUTPUT_TOPIC, and the
            # FLINK_* indicator knobs (configmaps/features.yaml).
            - configMapRef:
                name: pipeline-config
            # pipeline-secrets (raw target.name): VALKEY_PASSWORD, CLICKHOUSE_*,
            # S3/AWS keys.
            - secretRef:
                name: pipeline-secrets
            - secretRef:
                name: flink-s3-secret
            # SCRAM creds for the crypto.* ACL'd KafkaUser become KAFKA_SASL_USERNAME
            # / _PASSWORD consumed by StreamJob.kafkaSecurityProperties().
            - secretRef:
                name: crypto-app-consumer
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/kafka/ca
              readOnly: true
          env:
            # Stream topology (the ONLY crypto-specific wiring; platform
            #     StreamJob reads these generically). One stream "time_series":
            #     source crypto.validated, then FeatureFunction, then dual sink.
            - name: ENABLED_STREAMS
              value: "time_series"
            - name: STREAM_TIME_SERIES_TOPIC
              value: "crypto.validated"
            - name: STREAM_TIME_SERIES_FUNCTION
              value: "pipeline.functions.FeatureFunction"
            - name: STREAM_TIME_SERIES_GROUP
              value: "flink-features"          # matches the flink-* group ACL prefix
            # Kafka sink (bronze): EXACTLY_ONCE under a crypto.* txn-id prefix
            # (matches the crypto.* transactionalId ACL on crypto-app-consumer).
            - name: STREAM_TIME_SERIES_SINK_TOPIC
              value: "crypto.features.v1"
            - name: STREAM_TIME_SERIES_SINK_TXN_ID_PREFIX
              value: "crypto.flink-features"
            # Valkey online-cache sink: non-empty KEY_PREFIX enables the
            # side-output RedisSink writing features:{symbol}.
            - name: STREAM_TIME_SERIES_KEY_PREFIX
              value: "features:"
            # Valkey connection (host/port inline; VALKEY_PASSWORD via
            # pipeline-secrets envFrom). feature-engine used FEATURE_VALKEY__URL;
            # StreamJob reads discrete VALKEY_HOST / VALKEY_PORT.
            - name: VALKEY_HOST
              value: "valkey.storage.svc.cluster.local"
            - name: VALKEY_PORT
              value: "6379"
            # Flink hadoop-S3 plugin expects AWS_* (bridge from S3_* keys).
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: flink-s3-secret, key: S3_ACCESS_KEY } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: flink-s3-secret, key: S3_SECRET_KEY } }
            # OTEL auto-instrumentation fan-out.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://gateway-collector.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "crypto-stream-processor"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=use-case-crypto,deployment.environment=local"
          # Container securityContext satisfies Kyverno require-capability-drop-all
          # (capabilities is a container-only field) + blocks setuid post-start.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
      # Pod securityContext - UID/GID + seccomp for every container in the pod.
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        fsGroup: 9999
        seccompProfile: { type: RuntimeDefault }

  jobManager:
    replicas: 1
    # Right-sized for the 1-stream ExecutionGraph (was 6144m under the historic
    # 3-stream × autoscaler-inflated graph). HA-via-lease, so JM grows
    # vertically here, not horizontally.
    resource:
      memory: "2560m"
      cpu: 1
  taskManager:
    # Single-node invariant: one TM pod at idle, scale-out only on load. 4 slots
    # give 4-way intra-pod parallelism headroom (CPU multiplexing) without a
    # second pod. 3072m covers 4 slots' RocksDB block cache + network buffers +
    # heap for the feature operator.
    replicas: 1
    resource:
      memory: "3072m"
      # CPU right-sized to 0.5: at idle the TM streams a few symbols through the
      # feature operator; request==limit==2 never schedules on the single node
      # once aggregate requests saturate. Real load scales out via slots /
      # parallelism / a TM replica bump, not a fat idle reservation.
      cpu: 0.5

  # Application-mode job - operator submits the platform fat JAR baked at
  # /opt/flink/usrlib/flink-job.jar (local:// protocol) by the flink-job
  # Dockerfile. StandaloneApplicationClusterEntryPoint scans usrlib and runs
  # entryClass; StreamJob then wires streams from the env above.
  job:
    jarURI: local:///opt/flink/usrlib/flink-job.jar
    entryClass: pipeline.StreamJob
    args: []
    parallelism: 2
    # initialSavepointPath unset for first deploy; the Tekton savepoint-upgrade
    # task patches it on subsequent rollouts.
    upgradeMode: stateless
    state: running
