# VECTOR EMBEDDING - Sentiment Embedding Generation (Python + BERT)
# Generates BERT embeddings for news/sentiment and stores in Qdrant.
#
# Infrastructure dependencies:
#   - Qdrant (v1.13.2): Vector DB for embedding storage + similarity search
#     qdrant.storage.svc.cluster.local:6333 (REST) / 6334 (gRPC)
#   - ClickHouse: Sentiment data source, archival for aggregated features
#   - Redis: Feature cache for online serving (aggregated sentiment scores)
#   - Stencil (Raystack): Schema for embedding records
#
# Emits run outcome to platform Pushgateway via push-helper ConfigMap.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vector-embedding
  labels:
    app: vector-processing
    type: embedding
    mlops-platform.io/use-case: crypto
spec:
  schedule: "36 * * * *" # Hourly @ :36, staggered off :00 (single-HDD same-tick storm, 2026-06-30). (Was */5 - a 5-min cadence
  # spawned 288 embedding Job pods/day and fed the IO cascade; news-embedding
  # refresh is best-proper hourly, matching the supplementary-news ingest cadence.)
  # suspend declared so ArgoCD owns the field under SSA - an out-of-band
  # `kubectl patch` to suspend:true otherwise hides from the diff (#513).
  # startingDeadlineSeconds bounds missed-schedule lookback (>100 missed =
  # controller stops scheduling permanently).
  suspend: false
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    # Kueue admission: routes spawned Jobs to LocalQueue batch-queue
    # (use-case-crypto ns), which maps to ClusterQueue mlops-cluster-queue. The webhook
    # softened in platform/components/common/kueue/pre-apply.sh only acts
    # on workloads carrying this label, so unlabeled bootstrap Jobs bypass
    # admission entirely. Label MUST be on jobTemplate.metadata (Job level),
    # not on the pod template - Kueue's Job integration reads Job labels.
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: crypto-batch-queue
    spec:
      ttlSecondsAfterFinished: 600
      # 600 to 1800: in-cluster registry pulls under IO contention measured
      # at 18+ min (#402). The vector-processing image is larger than the
      # rest-collector image; first cold-cache fire pays once with
      # IfNotPresent below keeping later fires warm.
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: vector-processing
            job-type: embedding-generation
        spec:
          restartPolicy: OnFailure
          # Pod-level securityContext satisfies PodSecurity "restricted"
          # and the Kyverno require-run-as-nonroot ClusterPolicy. Dockerfile
          # USER 1000:1000 is what actually runs the process; this block
          # tells the kubelet to enforce it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: embedding
              image: vector-processing:latest
              # IfNotPresent - local-registry pull serialises behind the
              # rest-collector pulls (#402). Always policy forced a full
              # re-pull every fire which queued into 18+ min waits.
              imagePullPolicy: IfNotPresent
              # Container-level securityContext required by Kyverno
              # require-capability-drop-all and PodSecurity "restricted":
              # NET_RAW + similar caps off, no privilege escalation.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              # Wrap the entrypoint in a shell that emits the run outcome to
              # Pushgateway via the same push-helper ConfigMap the
              # rest-collector CronJobs use. Image already has /bin/sh.
              # UV mandate: `uv run --no-sync` runs the baked venv WITHOUT
              # re-syncing, so it never triggers the editable rebuild
              # (hatchling from PyPI) that fails air-gapped - same pattern the
              # image's own download_model step uses.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  . /scripts/push_job_metrics.sh
                  run_and_push uv run --no-sync main.py --mode embeddings
              envFrom:
                - configMapRef:
                    name: pipeline-config
                - secretRef:
                    name: pipeline-secrets
              env:
                - name: EMBEDDING_MODEL
                  value: "sentence-transformers/all-mpnet-base-v2"
                - name: EMBEDDING_DIM
                  value: "768"
                # Vector embeds news/sentiment TEXT (bronze.crypto_sentiment), not
                # OHLCV. VECTOR_DATA_TABLE overrides the DATA_TABLE inherited via
                # envFrom pipeline-config (= bronze.crypto_ohlcv for the batch path).
                - name: VECTOR_DATA_TABLE
                  value: "bronze.crypto_sentiment"
                # Qdrant collection the embeddings are written to (and that the
                # KF-04 vector-search eval queries). The platform vector service
                # defaults to the domain-agnostic "embeddings"
                # (services/processing/vector/config.py); the use case overrides it
                # to a domain-named collection. Every sibling VECTOR_* knob was
                # wired except this one, so the live collection was the generic
                # default and experiments/config.crypto.env COLLECTION
                # (crypto_sentiment) 404'd against it. Keep this value in sync with
                # experiments/config.crypto.env COLLECTION.
                - name: VECTOR_COLLECTION
                  value: "crypto_sentiment"
                - name: JOB_NAME
                  value: "vector_embedding"
                - name: USE_CASE
                  value: "crypto"
                # Pin the HuggingFace cache to the path the model is baked
                # into at image build (Dockerfile ENV). Path lives outside
                # /home/app/.cache/ to avoid colliding with the uv cache
                # BuildKit mount during image build. Without this env the
                # library falls back to /home/<user>/.cache/huggingface,
                # which would be cold (no baked weights) on every fire.
                - name: HF_HOME
                  value: "/home/app/hf-cache"
              resources:
                requests:
                  cpu: "500m"
                  memory: "2Gi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
              volumeMounts:
                - name: config
                  mountPath: /app/config
                # Model weights live in the image at /home/app/hf-cache
                # (baked by Dockerfile, HF_HOME env above). No model-cache
                # volume is mounted - an EmptyDir at /root/.cache/
                # huggingface was both wrong-path-for-uid-1000 and a cold
                # cache each fire.
                - name: push-helper
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: pipeline-config
            - name: push-helper
              configMap:
                name: push-helper
                defaultMode: 0555
