# =============================================================================
# Crypto use-case ServiceMonitors
# =============================================================================
# ServiceMonitor CRs (Prometheus Operator) are discovered by the platform
# Prometheus because its `serviceMonitorSelector: {}` +
# `serviceMonitorNamespaceSelector: {}` match everything.
#
# Selectors target the generic `app: <service>` label on the Services
# inherited from `platform/services/base/deployments/*.yaml`; the
# `namePrefix: crypto-` kustomize transformer rewrites the Service name to
# `crypto-<service>` in use-case-crypto without changing the `app:` label,
# so these selectors keep working.
#
# Endpoint port names match the `http` / `metrics` port names declared in
# each upstream Deployment's Service.
#
# Runtime checks (after ArgoCD sync):
#   kubectl get servicemonitors -n use-case-crypto
#   kubectl -n observability port-forward svc/kube-prometheus-stack-prometheus 9090 \
#     && open http://localhost:9090/targets
# =============================================================================
---
# -----------------------------------------------------------------------------
# Ingestion (KNF-01, ingest-lag alert feed)
# -----------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: websocket-collector
  namespace: use-case-crypto
  labels:
    app.kubernetes.io/part-of: use-case-crypto
    usecase: crypto
spec:
  selector:
    matchLabels: { app: websocket-collector }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rest-collector
  namespace: use-case-crypto
  labels:
    app.kubernetes.io/part-of: use-case-crypto
    usecase: crypto
spec:
  selector:
    matchLabels: { app: rest-collector }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# -----------------------------------------------------------------------------
# Quality (validator error-rate alert feed)
# -----------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: validator
  namespace: use-case-crypto
  labels:
    app.kubernetes.io/part-of: use-case-crypto
    usecase: crypto
spec:
  selector:
    matchLabels: { app: validator }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# -----------------------------------------------------------------------------
# Processing — Flink stream-processor (speed layer)
# -----------------------------------------------------------------------------
# A PodMonitor (not a ServiceMonitor): the Flink Prometheus reporter (port 9249)
# runs on BOTH the JobManager and every TaskManager pod, but the operator only
# fronts the JM REST (8081) with a Service — TM metrics have no Service. The
# PodMonitor scrapes pods directly by the `metrics: flink` label set on the
# FlinkDeployment podTemplate (flink/stream-processor.yaml), which the operator
# propagates to JM + TM pods. Replaces the retired feature-engine ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: stream-processor
  namespace: use-case-crypto
  labels:
    app.kubernetes.io/part-of: use-case-crypto
    usecase: crypto
spec:
  selector:
    matchLabels: { metrics: flink }
  podMetricsEndpoints:
    - port: metrics          # containerPort 9249 (named) on JM + TM
      path: /
      interval: 30s
      scrapeTimeout: 10s
---
# -----------------------------------------------------------------------------
# Serving + cache
# -----------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway
  namespace: use-case-crypto
  labels:
    app.kubernetes.io/part-of: use-case-crypto
    usecase: crypto
spec:
  selector:
    matchLabels: { app: gateway }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s  # gateway is on the hot path — scrape often
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: feature-cache
  namespace: use-case-crypto
  labels:
    app.kubernetes.io/part-of: use-case-crypto
    usecase: crypto
spec:
  selector:
    matchLabels: { app: feature-cache }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# -----------------------------------------------------------------------------
# ML bridge (ml-bridge latency alert feed)
# -----------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ml-bridge
  namespace: use-case-crypto
  labels:
    app.kubernetes.io/part-of: use-case-crypto
    usecase: crypto
spec:
  selector:
    matchLabels: { app: ml-bridge }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
