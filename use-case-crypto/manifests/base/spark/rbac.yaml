# Spark driver RBAC in this namespace. The spark-operator's own driver RBAC lives
# in data-processing; a SparkApplication running in use-case-crypto needs its own
# ServiceAccount + Role so the driver can create/manage executor pods, the driver
# headless Service, and the ConfigMaps Spark generates at runtime.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  labels:
    app.kubernetes.io/part-of: lakehouse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
  labels:
    app.kubernetes.io/part-of: lakehouse
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
  labels:
    app.kubernetes.io/part-of: lakehouse
subjects:
  - kind: ServiceAccount
    name: spark
roleRef:
  kind: Role
  name: spark-driver
  apiGroup: rbac.authorization.k8s.io
