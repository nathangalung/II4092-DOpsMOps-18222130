# ScheduledSparkApplication - the ONLY thing that turns spark-operator + Iceberg +
# Lakekeeper + Trino from "deployed" into "genuinely used". A 6-hourly batch that
# archives raw trades from the ClickHouse warehouse into an Iceberg table on MinIO
# (open, immutable, engine-neutral cold tier). Native operator scheduling means
# ZERO idle Spark pods between runs (respects the single-node idle invariant);
# `trigger`-free batch with an event-time watermark makes each run idempotent.
#
# Role split (no redundancy): ClickHouse = hot operational warehouse (serving, BI,
# Feast offline); Iceberg = cold open archive of the same raw ticks for long-term,
# engine-neutral history; Trino = federation that JOINs ClickHouse gold bars against
# Iceberg tick prints - a query neither store can answer alone.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: trades-lake-archive
  labels:
    app.kubernetes.io/part-of: lakehouse
spec:
  schedule: "45 */6 * * *"        # offset from dbt gold-build (15 */6) to avoid disk contention
  concurrencyPolicy: Forbid       # never overlap runs on a single HDD
  successfulRunHistoryLimit: 2
  failedRunHistoryLimit: 2
  template:
    type: Python
    pythonVersion: "3"
    mode: cluster
    image: apache/spark:4.1.1-scala2.13-java21-python3-r-ubuntu
    imagePullPolicy: IfNotPresent
    mainApplicationFile: local:///opt/spark-scripts/archive_trades.py
    sparkVersion: "4.1.1"
    restartPolicy:
      type: OnFailure
      onFailureRetries: 2
      onFailureRetryInterval: 30
    timeToLiveSeconds: 86400
    # Iceberg REST catalog (Lakekeeper) + S3A (MinIO) + runtime jars. Inlined here
    # rather than mounting the platform data-processing spark-defaults ConfigMap
    # (cross-namespace), per the small finite key set.
    sparkConf:
      "spark.sql.catalog.iceberg": "org.apache.iceberg.spark.SparkCatalog"
      "spark.sql.catalog.iceberg.type": "rest"
      "spark.sql.catalog.iceberg.uri": "http://lakekeeper.storage.svc.cluster.local:8181/catalog"
      "spark.sql.catalog.iceberg.warehouse": "warehouse"
      "spark.sql.catalog.iceberg.io-impl": "org.apache.iceberg.aws.s3.S3FileIO"
      "spark.sql.catalog.iceberg.s3.endpoint": "http://minio.storage.svc.cluster.local:9000"
      "spark.sql.catalog.iceberg.s3.path-style-access": "true"
      "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
      "spark.jars.packages": "org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0,org.apache.iceberg:iceberg-aws-bundle:1.11.0,com.clickhouse:clickhouse-jdbc:0.8.2,io.openlineage:openlineage-spark_2.13:1.26.0"
      "spark.hadoop.fs.s3a.endpoint": "http://minio.storage.svc.cluster.local:9000"
      "spark.hadoop.fs.s3a.path.style.access": "true"
      # OpenLineage to DataHub: the Spark archive shows up in the lineage graph.
      "spark.extraListeners": "io.openlineage.spark.agent.OpenLineageSparkListener"
      "spark.openlineage.transport.type": "http"
      "spark.openlineage.transport.url": "http://datahub-gms.data-governance.svc.cluster.local:8080/openapi/openlineage"
      "spark.openlineage.namespace": "lakehouse"
    volumes:
      - name: archive-script
        configMap:
          name: lake-archive-script
    driver:
      cores: 1
      coreLimit: "1200m"
      memory: "1g"
      serviceAccount: spark
      labels:
        kueue.x-k8s.io/queue-name: crypto-batch-queue
      envFrom:
        - secretRef: { name: pipeline-secrets }
      volumeMounts:
        - name: archive-script
          mountPath: /opt/spark-scripts
    executor:
      cores: 1
      instances: 1
      memory: "1g"
      envFrom:
        - secretRef: { name: pipeline-secrets }
      volumeMounts:
        - name: archive-script
          mountPath: /opt/spark-scripts
