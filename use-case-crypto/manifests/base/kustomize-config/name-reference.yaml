# Kustomize name-reference transformer configuration - KEDA ScaledObject
# Kustomize ships builtin name-reference transformers for core Kubernetes
# resources (e.g., HorizontalPodAutoscaler.spec.scaleTargetRef.name is
# automatically rewritten when namePrefix is applied to the referenced
# Deployment). CRDs are unknown to kustomize by default, so a ScaledObject
# declaring `scaleTargetRef.name: validator` in the base will render
# unchanged under `namePrefix: crypto-`, pointing KEDA at a bare `validator`
# Deployment that no longer exists (the Deployment itself was renamed to
# `crypto-validator`, so the unprefixed ref dangles).
#
# This file teaches kustomize to treat ScaledObject.spec.scaleTargetRef.name
# as a Deployment reference so the rewrite happens automatically. Mirrors
# the kustomize builtin behavior for HPA. Same mechanism works for any CRD
# that references a Deployment by name - add entries here if we grow more.
#
# Applies to both ScaledObject and ScaledJob (the two KEDA CRs that embed
# a scaleTargetRef). The fieldSpecs list is evaluated against every matching
# kind; kinds with no such field are silently skipped.
#
# Referenced from use-case-crypto/manifests/base/kustomization.yaml via
# `configurations:`. Also required in the platform base if platform-scope
# ScaledObjects are ever added - copy this file under platform/.
nameReference:
  - kind: Deployment
    fieldSpecs:
      - path: spec/scaleTargetRef/name
        kind: ScaledObject
      - path: spec/scaleTargetRef/name
        kind: ScaledJob
  # Tekton Pipeline.spec.tasks[].taskRef.name and .spec.finally[].taskRef.name
  # reference a Task.metadata.name in the same namespace. Without this rule,
  # `namePrefix: crypto-` rewrites Task names but leaves Pipeline taskRefs
  # dangling, so PipelineRun submit fails with "task not found".
  # Same pattern for EventListener bindings/template refs.
  - kind: Task
    fieldSpecs:
      - path: spec/tasks/taskRef/name
        kind: Pipeline
      - path: spec/finally/taskRef/name
        kind: Pipeline
  - kind: TriggerBinding
    fieldSpecs:
      - path: spec/triggers/bindings/ref
        kind: EventListener
  - kind: TriggerTemplate
    fieldSpecs:
      - path: spec/triggers/template/ref
        kind: EventListener
  - kind: Pipeline
    fieldSpecs:
      - path: spec/resourcetemplates/spec/pipelineRef/name
        kind: TriggerTemplate

  # Tekton Task.spec.volumes[].configMap.name and .spec.volumes[].secret.secretName
  # reference cluster-local ConfigMap / Secret resources mounted into the step
  # container. Kustomize's builtin recognises Pod.spec.volumes paths but treats
  # Task as opaque, so the `push-helper` ConfigMap reference in
  # tekton/pipeline.yaml's `push-pipeline-metrics-task` stays unprefixed
  # under `namePrefix: crypto-`, causing the step container to fail to mount
  # (`ConfigMap "push-helper" not found` because the rendered name is
  # `crypto-push-helper`).
  - kind: ConfigMap
    fieldSpecs:
      - path: spec/volumes/configMap/name
        kind: Task
      - path: spec/sidecars/envFrom/configMapRef/name
        kind: Task
      - path: spec/steps/envFrom/configMapRef/name
        kind: Task
  - kind: Secret
    fieldSpecs:
      - path: spec/volumes/secret/secretName
        kind: Task
      - path: spec/sidecars/envFrom/secretRef/name
        kind: Task
      - path: spec/steps/envFrom/secretRef/name
        kind: Task

  # Argo Rollouts (argoproj.io/v1alpha1) is also opaque to kustomize. The
  # canary's `spec.strategy.canary.steps[].analysis.templates[].templateName`
  # references a sibling AnalysisTemplate by metadata.name; without this rule
  # `namePrefix: crypto-` renames the AnalysisTemplate to
  # `crypto-success-rate-p99` but leaves the Rollout's templateName pointing
  # at `success-rate-p99`, and the Argo Rollouts controller fails with
  # `InvalidSpec: AnalysisTemplate 'success-rate-p99' not found`.
  #
  # Same pattern as FlinkDeployment for the pod template's configMapRef.
  # The pipeline-secrets envFrom is intentionally left out - it's an
  # ExternalSecret `target.name` literal that must keep its raw name (mirrors
  # the FlinkDeployment carve-out comment above).
  - kind: AnalysisTemplate
    fieldSpecs:
      - path: spec/strategy/canary/steps/analysis/templates/templateName
        kind: Rollout
  # The ml-bridge Rollout also mounts the `feast-feature-repo` ConfigMap as a
  # volume (feature_store.yaml.tmpl + definitions.py, rendered at pod start).
  # Kustomize treats Rollout as opaque, so without the volumes/configMap/name
  # rule below `namePrefix: crypto-` would leave the volume pointing at a bare
  # `feast-feature-repo` that no longer exists (rendered name is
  # `crypto-feast-feature-repo`).
  - kind: ConfigMap
    fieldSpecs:
      - path: spec/template/spec/containers/envFrom/configMapRef/name
        kind: Rollout
      - path: spec/template/spec/initContainers/envFrom/configMapRef/name
        kind: Rollout
      - path: spec/template/spec/volumes/configMap/name
        kind: Rollout

  # FlinkDeployment (flink.apache.org/v1beta1) is opaque to kustomize. Two
  # string refs inside its spec must follow `namePrefix: crypto-`:
  #
  #   1. spec.serviceAccount - the JM/TM pods run under this SA. namePrefix
  #      renames the ServiceAccount resource `flink` to `crypto-flink`, but the
  #      CRD's serviceAccount field stays `flink` without this rule, so the
  #      operator schedules pods against a non-existent SA (pods never admit).
  #
  #   2. podTemplate envFrom configMapRef pipeline-config - the inherited
  #      platform ConfigMap is renamed to `crypto-pipeline-config`; the
  #      FlinkDeployment's envFrom must follow or the JM/TM boot with no
  #      KAFKA_BROKERS / FLINK_* config and StreamJob dies on the required-env
  #      check.
  #
  # The secretRef envFroms (pipeline-secrets, flink-s3-secret, crypto-app-consumer)
  # are deliberately NOT listed: each is an ExternalSecret `target.name` literal
  # that keeps its raw (un-prefixed) name, so the podTemplate refs already match
  # the rendered Secret - adding a Secret rule here would be a no-op anyway
  # (no Secret-kind resource carries those names) but is omitted for clarity.
  - kind: ServiceAccount
    fieldSpecs:
      - path: spec/serviceAccount
        kind: FlinkDeployment
      # Tekton EventListener (triggers.tekton.dev) is opaque to kustomize the
      # same way: namePrefix renames the ServiceAccount resource
      # `tekton-triggers-sa` to `crypto-tekton-triggers-sa`, but the EL's
      # spec.serviceAccountName kept the bare name, so the Triggers
      # controller's generated `el-*` Deployment failed pod creation with
      # `serviceaccount "tekton-triggers-sa" not found` (26d outage of the CI
      # webhook listener). The overlay JSON patch that tried to fix this
      # targeted the POST-prefix name `crypto-build-listener`, which patches
      # never see (they match pre-prefix names) - removed in favour of this
      # rule.
      - path: spec/serviceAccountName
        kind: EventListener
  - kind: ConfigMap
    fieldSpecs:
      - path: spec/podTemplate/spec/containers/envFrom/configMapRef/name
        kind: FlinkDeployment

# IMAGE TRANSFORMER - FlinkDeployment.spec.image
# Kustomize's builtin image transformer only walks PodSpec container image
# paths (spec/containers/image, spec/template/spec/containers/image, …). The
# FlinkDeployment carries its image at the CRD-level field spec/image, which the
# builtin never sees - so the overlay `images:` mapping
# (flink-job maps to localhost:5000/crypto-flink-job:latest) would NOT apply and the
# operator would try to pull the bare `flink-job` name. This FieldSpec teaches
# the image transformer to also rewrite spec/image on FlinkDeployment. Custom
# `images` FieldSpecs are ADDED to the builtin set (not replaced), so every
# regular Deployment image keeps being rewritten as before.
images:
  - path: spec/image
    kind: FlinkDeployment
