# use-case-crypto KEDA ScaledObjects (ADR-022, ADR-026).
# KEDA first-party Kafka and prometheus scalers replace the old
# HPA + prometheus-adapter chain, which was brittle and pinned to an
# outdated adapter release. KEDA owns three workloads here: validator
# (Kafka lag on rest.raw + ws.raw), analyzer (Kafka lag on
# predictions.v1), and gateway (prometheus RPS + cpu + memory).
# dashboard-backend and rest-collector keep plain CPU HPAs in
# hpa/autoscaling.yaml. KEDA generates an HPA per ScaledObject and
# refuses to reconcile if an operator-owned HPA targets the same
# Deployment, so feature-engine-hpa and gateway-hpa are removed from
# hpa/autoscaling.yaml; do not re-add them.
---
# STREAM PROCESSOR (Flink)
# The crypto speed layer is the Flink FlinkDeployment `stream-processor`
# (flink/stream-processor.yaml), NOT a Kubernetes Deployment - so KEDA cannot
# drive it via a `scaleTargetRef` (ScaledObject targets Deployment/StatefulSet
# only). Flink elasticity is owned INSIDE the engine: 4 task slots give in-place
# parallelism headroom (2 to 4) on the single TM pod, and the operator-level
# autoscaler/parallelism + a TM-replica bump cover real-load scale-out. The
# Kafka-lag SLO on the `flink-features` consumer group (observability/slos.yaml)
# is the burn-rate signal. There is therefore intentionally NO ScaledObject for
# the stream processor here (this replaces the retired feature-engine-kafka-lag
# SO, which targeted the bespoke Rust feature-engine Deployment).
---
# VALIDATOR
# Validator has TWO ingress topics (REST-polled + WebSocket-streamed) so we
# declare two triggers - KEDA OR-combines them and scales to whichever is
# hotter.  Single consumer group on the Deployment (validator) joins both.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: validator-kafka-lag
  namespace: use-case-crypto
  labels:
    app.kubernetes.io/part-of: mlops-platform
    app.kubernetes.io/component: scaling
    use-case: crypto
    scaled-resource: validator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: validator
  minReplicaCount: 1
  # Single spinning-disk cap (verified 2026-06-30): each validator replica writes
  # crypto.validated; the ClickHouse Kafka-engine consumes it onto one HDD. 8 concurrent
  # validators saturated the disk (IO-PSI 67, CH ops timing out). 3 is the disk-serveable
  # scale-on-load bound here; raise it once the k3s data dir is on an SSD/2nd disk.
  maxReplicaCount: 3
  pollingInterval: 15
  cooldownPeriod: 180
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 2
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 240
  triggers:
    - type: kafka
      authenticationRef:
        name: crypto-keda-kafka-auth
      metadata:
        bootstrapServers: platform-kafka-kafka-bootstrap.data-ingestion.svc.cluster.local:9093
        sasl: scram_sha512
        tls: enable
        consumerGroup: validator
        topic: crypto.rest.raw
        lagThreshold: "2000"
        offsetResetPolicy: latest
    - type: kafka
      authenticationRef:
        name: crypto-keda-kafka-auth
      metadata:
        bootstrapServers: platform-kafka-kafka-bootstrap.data-ingestion.svc.cluster.local:9093
        sasl: scram_sha512
        tls: enable
        consumerGroup: validator
        topic: crypto.ws.raw
        lagThreshold: "2000"
        offsetResetPolicy: latest
---
# ANALYZER
# Analyzer runs the data-quality check on every prediction written by
# ml-bridge. Lag here is bursty (driven by model inference rate), so the
# threshold is aggressive to keep it responsive and the max is modest
# because GE checks are relatively cheap.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analyzer-kafka-lag
  namespace: use-case-crypto
  labels:
    app.kubernetes.io/part-of: mlops-platform
    app.kubernetes.io/component: scaling
    use-case: crypto
    scaled-resource: analyzer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analyzer
  minReplicaCount: 1
  # Single-disk cap (2026-06-30): GE checks write results to ClickHouse; bound the
  # disk-path fan-out to 2 on the one HDD. Raise with an SSD/2nd disk.
  maxReplicaCount: 2
  pollingInterval: 15
  cooldownPeriod: 180
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: kafka
      authenticationRef:
        name: crypto-keda-kafka-auth
      metadata:
        bootstrapServers: platform-kafka-kafka-bootstrap.data-ingestion.svc.cluster.local:9093
        sasl: scram_sha512
        tls: enable
        consumerGroup: analyzer
        topic: crypto.predictions.v1
        lagThreshold: "500"
        offsetResetPolicy: latest
---
# GATEWAY (HTTP RPS, CPU, memory).
# ADR-026: the gateway HPA was previously a `kind: HorizontalPodAutoscaler`
# that combined CPU + memory Resource metrics with a Pods-type custom metric
# `http_requests_per_second`. That custom metric was served by
# prometheus-adapter translating `http_requests_total` (Prometheus, gateway
# ServiceMonitor) through a naming rule. prometheus-adapter v0.12.0 is the
# upstream HEAD (May 2024) and does not satisfy the 2026-minimum-release rule
# in VERSION.MD. Because the only cluster-wide consumer of the adapter is
# this single HPA, we retire the adapter and replace it with three KEDA
# triggers on the same Deployment: a `prometheus` trigger (RPS) plus the
# built-in `cpu` and `memory` triggers (Utilization). KEDA OR-combines them
# and emits a single HPA - `keda-hpa-gateway-http-rps` - preserving the old
# behaviour while removing the APIService + extra controller.
# Query note: `sum(rate(http_requests_total{app="gateway"}[2m]))` matches the
# old prometheus-adapter `metricsQuery` exactly. metricType: AverageValue at
# threshold 100 preserves the old HPA's per-replica semantics (the HPA Pods
# type divides by replica count); KEDA does the same arithmetic.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: gateway-http-rps
  namespace: use-case-crypto
  labels:
    app.kubernetes.io/part-of: mlops-platform
    app.kubernetes.io/component: scaling
    use-case: crypto
    scaled-resource: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  # Single-node platform mandate: idle = 1 replica.
  # Load triggers (prometheus rps, cpu, memory) scale up to 20 on real demand.
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 15
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        # kube-prometheus-stack ships Prometheus at this in-cluster hostname.
        serverAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
        metricName: gateway_http_rps
        # Selector matches the gateway ServiceMonitor's label on the series.
        # The 2m rate window matches the prior prometheus-adapter config
        # (metricsQuery used [2m]); shorter windows are noisy on low traffic.
        query: sum(rate(http_requests_total{app="gateway"}[2m]))
        threshold: "100"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"
