# ArgoCD Application - Airflow DAGs-binding (use-case to platform)
# Separate from the main `crypto-use-case-*` Application (generated by
# applicationset.yaml) because this delivers a single FIXED-NAME ConfigMap into
# the platform's `data-processing` namespace, and must therefore bypass the
# overlay's `namePrefix: crypto-` + `namespace: use-case-crypto` transformers.
# It points at the non-prefixed kustomization manifests/airflow-dags-binding/.
#
# The ConfigMap (`airflow-dags-source-override`) tells the platform Airflow
# git-sync which repo holds this use-case's DAGs - see the kustomization +
# ConfigMap headers for the full contract.
#
# Apply order (one-time bootstrap, after application.yaml + applicationset.yaml):
#   kubectl apply -f use-case-crypto/argocd/airflow-dags-binding.yaml
# (wired into `make usecase-crypto-argocd`). Requires `data-processing` in the
# AppProject `destinations` allowlist (see application.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypto-airflow-dags-binding
  namespace: gitops
  labels:
    app.kubernetes.io/part-of: mlops-platform
    app.kubernetes.io/component: usecase
    usecase: crypto
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: use-case-crypto
  source:
    repoURL: "http://gitea.gitops.svc.cluster.local:3000/platform/use-case-crypto.git"
    path: use-case-crypto/manifests/airflow-dags-binding
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: data-processing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      # RespectIgnoreDifferences removed 2026-06-10 - with the argocd-cm
      # array-wildcard ignores it silently no-ops real changes inside the same
      # array element (argo-cd#25284). Full rationale in applicationset.yaml.
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 10m }
  revisionHistoryLimit: 10
